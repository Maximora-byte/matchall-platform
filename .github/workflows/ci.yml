name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [hub, dns, mirrors]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run service tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.service }}" == "dns" ]]; then
            python -m pytest -q
          else
            for test in test_*.py; do
              python -m unittest -v "$test"
            done
          fi

  astro-apps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - main-site
          - cv-site
          - status-site
          - console-site
          - entry-sites
          - dns-site
          - docs-site
          - mirrors-site
          - investment-site
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: Check
        run: npm run check --if-present
      - name: Build
        run: npm run build

  fuwari:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/fuwari-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm run check
      - run: pnpm run build

  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate first-party WordPress PHP
        run: find wordpress -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  go-modules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - services/dns-transports
          - vendor/moddns-matchall/api
          - vendor/moddns-matchall/blocklists
          - vendor/moddns-matchall/dnscheck
          - vendor/moddns-matchall/libs
          - vendor/moddns-matchall/proxy
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Test module
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.module }}" == "vendor/moddns-matchall/api" ]]; then
            # Upstream's service/apple tests require repository-local development
            # signing certificates. Those private-key fixtures are deliberately
            # excluded from this repository.
            go test $(go list ./... | grep -v '/service/apple$')
          else
            go test ./...
          fi

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject runtime and secret-shaped files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(find . -type f \
            \( -name '.env' -o -name '*.secret' -o -name '*.key' -o -name '*.pem' \
               -o -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \
               -o -size +50M \) -print)
          if [[ -n "$forbidden" ]]; then
            printf '%s\n' "$forbidden"
            exit 1
          fi
