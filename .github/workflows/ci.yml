name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR runs; each main/dispatch run keeps its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-services:
    needs: repository-hygiene
    if: needs.repository-hygiene.outputs.has_python_services == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.repository-hygiene.outputs.python_services) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run service tests
        shell: bash
        env:
          DATA_DIR: ${{ runner.temp }}/matchall-${{ matrix.service }}-data
        run: |
          set -euo pipefail
          if [[ "${{ matrix.service }}" == "dns" ]]; then
            python -m pytest -q
          else
            for test in test_*.py; do
              python -m unittest -v "$test"
            done
          fi

  astro-apps:
    needs: repository-hygiene
    if: needs.repository-hygiene.outputs.has_astro_apps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.repository-hygiene.outputs.astro_apps) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: Check
        run: npm run check --if-present
      - name: Unit tests
        if: matrix.app == 'status-site' || matrix.app == 'main-site'
        run: npm test
      - name: Build
        run: npm run build
      - name: Install UI test browser
        if: matrix.app == 'status-site' || matrix.app == 'main-site'
        run: npx playwright install --with-deps chromium
      - name: Public UI regressions
        if: matrix.app == 'status-site' || matrix.app == 'main-site'
        run: npm run test:ui
      - name: Save failed UI evidence
        if: failure() && (matrix.app == 'status-site' || matrix.app == 'main-site')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-ui-failures
          path: apps/${{ matrix.app }}/test-results
          retention-days: 7

  vendor-frontend:
    needs: repository-hygiene
    if: needs.repository-hygiene.outputs.vendor_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vendor/moddns-matchall/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vendor/moddns-matchall/app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run tsc
      - run: npm test
      - run: npm run build

  fuwari:
    needs: repository-hygiene
    if: needs.repository-hygiene.outputs.fuwari == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/fuwari-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm run check
      - run: pnpm run build

  php-syntax:
    needs: repository-hygiene
    if: needs.repository-hygiene.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate first-party WordPress PHP
        run: find wordpress -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  go-modules:
    needs: repository-hygiene
    if: needs.repository-hygiene.outputs.has_go_modules == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.repository-hygiene.outputs.go_modules) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Test module
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.module }}" == "vendor/moddns-matchall/api" ]]; then
            # Upstream's service/apple tests require repository-local development
            # signing certificates. Those private-key fixtures are deliberately
            # excluded from this repository.
            go test $(go list ./... | grep -v '/service/apple$')
          else
            go test ./...
          fi

  repository-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python_services: ${{ steps.changes.outputs.python_services }}
      has_python_services: ${{ steps.changes.outputs.has_python_services }}
      astro_apps: ${{ steps.changes.outputs.astro_apps }}
      has_astro_apps: ${{ steps.changes.outputs.has_astro_apps }}
      go_modules: ${{ steps.changes.outputs.go_modules }}
      has_go_modules: ${{ steps.changes.outputs.has_go_modules }}
      fuwari: ${{ steps.changes.outputs.fuwari }}
      php: ${{ steps.changes.outputs.php }}
      vendor_frontend: ${{ steps.changes.outputs.vendor_frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          # PR routing uses the real base/head merge-base, including renames.
          fetch-depth: 0
      - name: Test CI selection
        run: python -m unittest discover -s scripts -p 'test_ci_select.py' -v
      - name: Select affected checks
        id: changes
        shell: bash
        run: |
          python scripts/ci_select.py \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" \
            --output "$GITHUB_OUTPUT"
      - name: Reject runtime and secret-shaped files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(find . -type f \
            \( -name '.env' -o -name '*.secret' -o -name '*.key' -o -name '*.pem' \
               -o -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \
               -o -size +50M \) -print)
          if [[ -n "$forbidden" ]]; then
            printf '%s\n' "$forbidden"
            exit 1
          fi
