{% extends 'base.html' %}{% block content %}
<section class="section-head"><h1 class="small-title">从查询记录添加规则</h1><p>请检查后再保存。域名默认包含子域名；已有冲突规则需要在过滤设置中处理。</p></section><section class="panel"><p>{{ '当前已启用个性化解析，保存后将影响后续查询。' if mapping.routing else '当前仍走原解析：仅保存规则，不会启用 modDNS 或改变 DNS 地址。' }}</p><form action="/filters" method="post"><input type="hidden" name="csrf_token" value="{{ user.csrf }}"><label>规则内容<input name="value" value="{{ value }}" maxlength="255" required></label><label>处理方式<select name="action"><option value="block" {{ 'selected' if action == 'block' else '' }}>阻止</option><option value="allow" {{ 'selected' if action == 'allow' else '' }}>允许</option></select></label><button class="button">保存过滤规则</button></form><p><a href="/queries">取消，返回查询记录</a></p></section>
{% endblock %}
