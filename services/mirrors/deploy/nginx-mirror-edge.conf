limit_conn_zone $binary_remote_addr zone=mirror_edge_per_ip:10m;

server {
    listen 80;
    listen [::]:80;
    server_name gz-mirrors.maximoraverse.org;

    server_tokens off;
    client_max_body_size 1m;

    location = /healthz {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /artifact/ {
        limit_conn mirror_edge_per_ip 2;
        limit_rate 576k;
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1h;
        add_header X-Mirror-Edge guangzhou always;
    }

    location / {
        return 404;
    }
}
